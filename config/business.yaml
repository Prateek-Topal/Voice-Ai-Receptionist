# Edit this file to change the business the receptionist works for.
# No code changes needed — the persona prompt is generated from it.

business:
  name: Sunrise Dental Clinic
  type: dental clinic
  address: 12 Main Road, Example City
  phone: "+91 98765 43210"
  timezone: Asia/Kolkata

hours:
  monday: "9 AM to 7 PM"
  tuesday: "9 AM to 7 PM"
  wednesday: "9 AM to 7 PM"
  thursday: "9 AM to 7 PM"
  friday: "9 AM to 7 PM"
  saturday: "10 AM to 2 PM"
  sunday: closed

services:
  - name: General check-up
    duration_minutes: 30
  - name: Teeth cleaning
    duration_minutes: 45
  - name: Tooth filling
    duration_minutes: 60
  - name: Root canal consultation
    duration_minutes: 30
  - name: Tooth extraction
    duration_minutes: 45

policies:
  - Please arrive 10 minutes before your appointment.
  - Cancellations should be made at least 24 hours in advance.
  - Walk-ins are accepted only if a slot is free.

receptionist:
  name: Aria
  # {business_name} and {name} are filled in automatically.
  greeting: "Hello, thank you for calling {business_name}. This is {name}. How can I help you today?"
  # Said when the caller says goodbye, right before hanging up.
  farewell: "Thanks for calling {business_name}. Take care, goodbye!"
  # Expected digits in a caller's phone number (10 for Indian mobiles).
  phone_digits: 10
  escalation: "Politely say a team member will call them back, and take their name and number."
  # Extra words the speech-to-text should recognise reliably.
  extra_keyterms:
    - appointment
    - reschedule
    - dentist
