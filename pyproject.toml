[project]
name = "voice-ai-receptionist"
version = "0.1.0"
description = "AI voice receptionist that answers calls and books appointments"
requires-python = ">=3.10,<3.15"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
